services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-oootp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DB_HOST: postgres
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - public

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - VITE_BACKEND_URL=http://backend:3333
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public

networks:
  internal:
  public:

volumes:
  postgres_data:
