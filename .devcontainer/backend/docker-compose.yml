services:
  backend:
    image: mcr.microsoft.com/devcontainers/javascript-node:24
    volumes:
      - ../../:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    environment:
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: oootp
      POSTGRES_PASSWORD: oootp
      POSTGRES_DB: oootp
    volumes:
      - backend_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oootp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  backend_postgres_data:
