# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/maru-runner/refs/heads/main/tasks.schema.json

includes:
  - setup: https://raw.githubusercontent.com/defenseunicorns-udm/udm-common/feat/configurable-fulcio-oidc-issuer/tasks/setup.yaml
  - attest: https://raw.githubusercontent.com/defenseunicorns-udm/udm-common/feat/configurable-fulcio-oidc-issuer/tasks/attest.yaml
  - build: https://raw.githubusercontent.com/defenseunicorns-udm/udm-common/feat/configurable-fulcio-oidc-issuer/tasks/build.yaml
  - scan: https://raw.githubusercontent.com/defenseunicorns-udm/udm-common/feat/configurable-fulcio-oidc-issuer/tasks/scan.yaml
  - vouch: https://raw.githubusercontent.com/defenseunicorns-udm/udm-common/feat/configurable-fulcio-oidc-issuer/tasks/vouch.yaml
  - publish: https://raw.githubusercontent.com/defenseunicorns-udm/udm-common/feat/configurable-fulcio-oidc-issuer/tasks/publish.yaml
  - olm: https://raw.githubusercontent.com/defenseunicorns-udm/udm-common/feat/configurable-fulcio-oidc-issuer/tasks/olm.yaml

tasks:

  - name: lint
    description: Lint all TypeScript source via Turbo
    actions:
      - cmd: npm run lint

  - name: build-images
    description: Build Docker images for backend and frontend
    actions:
      - cmd: docker build -t oootp-backend -f apps/backend/Dockerfile .
      - cmd: docker build -t oootp-frontend -f apps/frontend/Dockerfile .

  - name: default
    description: Full dev setup including cluster and core
    actions:
      - task: setup-cluster
      - task: dev

  - name: dev
    description: Build images and deploy the bundle on an existing cluster
    actions:
      - task: build-images
      - cmd: uds zarf package create . --confirm --no-progress --flavor upstream --skip-sbom
      - shell:
          linux: bash
          darwin: bash
        cmd: |
          for pkg in $(find . -maxdepth 1 -name "zarf-package-*-${UDS_ARCH}-dev-upstream.tar.zst" 2>/dev/null); do
            cp "${pkg}" "$(echo "${pkg}" | sed 's/-upstream\.tar\.zst/.tar.zst/')"
          done
          UDS_CONFIG=bundle/uds-config.yaml uds create bundle/ --confirm --no-progress
      - env:
          - UDS_CONFIG=bundle/uds-config.yaml
        cmd: uds deploy "bundle/uds-bundle-oootp-test-${UDS_ARCH}-dev.tar.zst" --confirm --no-progress

  - name: setup-cluster
    description: Create k3d cluster and deploy UDS core
    actions:
      - cmd: uds deploy k3d-core:latest --confirm
