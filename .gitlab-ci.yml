stages:
  - ci
  - publish

variables:
  # renovate: datasource=github-releases depName=defenseunicorns/uds-cli
  UDS_VERSION: "v0.30.4"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

.install-deps: &install-deps
  - apt-get update -qq && apt-get install -y -qq curl docker.io
  - |
    curl --retry-all-errors --retry 5 -fSL \
      "https://github.com/defenseunicorns/uds-cli/releases/download/${UDS_VERSION}/uds-cli_${UDS_VERSION}_Linux_amd64" \
      -o /usr/local/bin/uds
    chmod +x /usr/local/bin/uds

ci:
  stage: ci
  image: node:24
  services:
    - name: docker:24-dind
      command: ["--tls=false"]
  before_script:
    - *install-deps
  script:
    - npm ci
    - uds run lint
    - |
      uds run scan:security \
        --with opengrep_scan_path=apps/ \
        --with enable_sigstore=false
    - uds run build-images
  artifacts:
    paths:
      - gitleaks.sarif.json
      - opengrep.sarif.json
    when: always
    expire_in: 1 day

publish:
  stage: publish
  image: node:24
  services:
    - name: docker:24-dind
      command: ["--tls=false"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: ci
      artifacts: true
  before_script:
    - *install-deps
  script:
    - uds run build-images
    - |
      uds run vouch:package \
        --with github_token="$GITHUB_TOKEN" \
        --with olm_cat="$OLM_CAT" \
        --with olm_org="$OLM_ORG" \
        --with enable_sigstore=false \
        --with sarif_files="gitleaks.sarif.json,opengrep.sarif.json"
    - |
      uds run publish:zarf-package \
        --with registry="registry.uds-mil.us" \
        --with registry_org="$REGISTRY_ORG" \
        --with registry_user_id="$REGISTRY_USER_ID" \
        --with registry_password="$REGISTRY_PASSWORD"
