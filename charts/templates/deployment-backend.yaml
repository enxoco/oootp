apiVersion: apps/v1
kind: Deployment
metadata:
    name: backend
    namespace: oootp
    labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: oootp
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: backend
    template:
        metadata:
            name: ""
            labels:
                app.kubernetes.io/name: backend
        spec:
            initContainers:
                - name: wait-postgres
                  image: busybox:1.36
                  imagePullPolicy: IfNotPresent
                  command:
                    - sh
                    - -c
                    - until nc -z pg-cluster.postgres.svc.cluster.local 5432; do echo waiting for pg-cluster; sleep 2; done
                  securityContext:
                    readOnlyRootFilesystem: true
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
            containers:
                - name: backend
                  image: oootp-backend
                  imagePullPolicy: IfNotPresent
                  env:
                    - name: APP_KEY
                      value: Z2ZA6u058Ciogyjc7s2jxSMarkMpzYt9
                    - name: APP_URL
                      value: http://localhost
                    - name: DB_DATABASE
                      value: oootp
                    - name: DB_HOST
                      value: pg-cluster.postgres.svc.cluster.local
                    - name: DB_SSL
                      value: "true"
                    - name: DB_PORT
                      value: "5432"
                    - name: DB_USER
                      valueFrom:
                        secretKeyRef:
                          name: oootp-postgres
                          key: DB_USER
                    - name: DB_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: oootp-postgres
                          key: DB_PASSWORD
                    - name: HOST
                      value: 0.0.0.0
                    - name: LOG_LEVEL
                      value: info
                    - name: NODE_ENV
                      value: production
                    - name: PORT
                      value: "3333"
                    - name: SESSION_DRIVER
                      value: cookie
                    - name: TZ
                      value: UTC
                  ports:
                    - name: http
                      containerPort: 3333
                      protocol: TCP
                  securityContext:
                    readOnlyRootFilesystem: true
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                  volumeMounts:
                    - name: tmp
                      mountPath: /tmp
                  livenessProbe:
                    exec:
                        command:
                            - wget
                            - -qO-
                            - http://127.0.0.1:3333
                    periodSeconds: 90
                    initialDelaySeconds: 30
                    timeoutSeconds: 30
                    failureThreshold: 5
            volumes:
                - name: tmp
                  emptyDir: {}
